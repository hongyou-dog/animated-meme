<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f2fa" />
    <meta name="description" content="炸蝦狗狗的連結頁" />
    <title>炸蝦狗狗｜@timelyc1983</title>
    <style>
      :root {
        color-scheme: light;
        background: #f3f2fa;
        color: #111;
        font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      }

      * { box-sizing: border-box; }

      html, body {
        min-height: 100%;
        margin: 0;
        background: #f3f2fa;
      }

      body { overflow-x: hidden; }

      .page {
        position: relative;
        width: min(100%, 1038px);
        aspect-ratio: 1038 / 1928;
        margin: 0 auto;
        overflow: hidden;
        background: #f3f2fa;
      }

      .brand,
      .handle,
      .copy,
      .art-link {
        position: absolute;
      }

      .brand,
      .handle,
      .copy {
        margin: 0;
        font-weight: 400;
        line-height: 1.7;
      }

      .brand {
        top: 14.6%;
        left: 53%;
        width: max-content;
        transform: translateX(-50%);
        text-align: center;
        font-size: clamp(14px, 3.6vw, 38px);
      }

      .handle {
        top: 18.6%;
        left: 44.4%;
        width: max-content;
        transform: translateX(-50%);
        text-align: center;
        font-size: clamp(15px, 3.8vw, 40px);
      }

      .art-link {
        display: block;
        line-height: 0;
        -webkit-tap-highlight-color: transparent;
      }

      .art-link img {
        display: block;
        width: 100%;
        height: auto;
      }

      .art-link:focus-visible {
        outline: 2px solid #ff36ae;
        outline-offset: 4px;
        border-radius: 12px;
      }

      .sticker-store {
        top: 30.5%;
        left: 15%;
        width: 32%;
      }

      .first-copy {
        top: 30.5%;
        left: 0;
        width: 100%;
        height: 7%;
        text-align: left;
        font-size: clamp(15px, 3.6vw, 38px);
      }

      .first-copy span {
        position: absolute;
        display: block;
        white-space: nowrap;
      }

      .first-copy span:first-child { left: 62.8%; }
      .first-copy span:last-child { left: 56.5%; top: 1.7em; }

      .wallpaper {
        top: 42.4%;
        left: 51%;
        width: 29%;
      }

      .line-friend {
        top: 59.1%;
        left: 18.5%;
        width: 25.5%;
      }

      .last-copy {
        top: 79.9%;
        left: 0;
        width: 100%;
        height: 8%;
        text-align: left;
        font-size: clamp(15px, 3.6vw, 38px);
      }

      .last-copy span {
        position: absolute;
        display: block;
        white-space: nowrap;
      }

      .last-copy span:first-child { left: 40.5%; }
      .last-copy span:last-child { left: 61.5%; top: 2em; }
    </style>
  </head>
  <body>
    <main class="page" aria-label="炸蝦狗狗連結頁">
      <h1 class="brand">炸蝦狗狗</h1>
      <p class="handle">@timelyc1983</p>

      <p class="copy first-copy"><span>我同事</span><span>因為生活能夠自理</span></p>

      <a class="art-link sticker-store"
        href="https://store.line.me/stickershop/author/2199616/zh-Hant"
        target="_blank" rel="noopener noreferrer"
        aria-label="前往 LINE 貼圖小舖">
        <img src="https://raw.githubusercontent.com/hongyou-dog/animated-meme/main/link-line%20sticker%20store.png" alt="LINE 貼圖小舖" />
      </a>

      <a class="art-link wallpaper"
        href="https://pin.it/35cJlit53"
        target="_blank" rel="noopener noreferrer"
        aria-label="前往手機桌布 Pinterest 頁面">
        <img src="https://raw.githubusercontent.com/hongyou-dog/animated-meme/main/link-lWallpaper%20Phone.png" alt="手機桌布連結" />
      </a>

      <a class="art-link line-friend"
        href="https://line.me/R/ti/p/@315kvgxl?oat_content=url&amp;ts=05082049"
        target="_blank" rel="noopener noreferrer"
        aria-label="加入 LINE 好友">
        <img src="https://raw.githubusercontent.com/hongyou-dog/animated-meme/main/link-line.png" alt="LINE 好友連結" />
      </a>

      <p class="copy last-copy"><span>所以一直沒有被發現</span><span>是輕度智障</span></p>
    </main>
  </body>
</html>
